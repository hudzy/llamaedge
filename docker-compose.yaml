# Generated from models.yaml — run: make generate
services:
  qwen3.5-0.8b:
    image: hudzy/llamaedge:qwen3.5-0.8b
    build:
      context: .
      args:
        MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q5_K_M.gguf
        PROMPT_FORMAT: qwen3-no-think
        CONTEXT_SIZE: "24576"
        THREADS: "4"
    container_name: llamaedge-qwen3.5-0.8b
    ports:
      - "8082:8080"
    cpus: 4.0
    mem_limit: 6g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    profiles:
      - qwen
