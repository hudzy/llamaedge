name: Build and Push Docker Images

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - init.sh
      - models.yaml
      - scripts/generate-compose.sh
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build"
        required: false
        type: choice
        default: all
        options:
          - all
          - qwen3.5-0.8b
          - llama3.2-1b
          - gemma3-1b
          - gemma3-270m
          - gemma4-e2b

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify docker-compose.yaml
        run: make check-compose

      - name: Set build matrix
        id: set-matrix
        run: |
          selected="${{ github.event.inputs.model }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$selected" && "$selected" != "all" ]]; then
            matrix=$(yq -o=json -I=0 "
              .models[\"${selected}\"] as \$m |
              if \$m == null then error(\"unknown model: ${selected}\") else
              {\"include\": [{\"model\": \"${selected}\", \"model_url\": \$m.model_url, \"prompt_format\": \$m.prompt_format, \"context_size\": (\$m.context_size | tostring), \"threads\": (\$m.threads | tostring)}]}
              end
            " models.yaml)
          else
            matrix=$(yq -o=json -I=0 '
              {"include": [.models | to_entries | .[] | {
                "model": .key,
                "model_url": .value.model_url,
                "prompt_format": .value.prompt_format,
                "context_size": (.value.context_size | tostring),
                "threads": (.value.threads | tostring)
              }]}
            ' models.yaml)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.model }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hudzy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hudzy/llamaedge
          tags: |
            type=raw,value=${{ matrix.model }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.model }}
          cache-to: type=gha,mode=max,scope=${{ matrix.model }}
          build-args: |
            MODEL_URL=${{ matrix.model_url }}
            PROMPT_FORMAT=${{ matrix.prompt_format }}
            CONTEXT_SIZE=${{ matrix.context_size }}
            THREADS=${{ matrix.threads }}
